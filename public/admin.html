<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>管理员 · 旅游规划</title><link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script></head>
<body><main class="admin-shell">
<header class="admin-heading"><div><p>旅游规划</p><h1>项目管理</h1></div><a href="/">返回旅行页面</a></header>
<p id="admin-message" role="status" aria-live="polite"></p>
<form id="admin-login" class="admin-card"><h2>管理员登录</h2><label class="field">管理员密码<input name="password" type="password" required autocomplete="current-password"></label><button class="primary-button">登录管理</button><p>管理员密码由部署者设置，与同行者的项目口令独立。</p></form>
<div id="admin-content" hidden>
<form id="project-settings" class="admin-card"><h2>项目设置</h2><label class="field">项目名称<input name="name" required maxlength="60"></label><label class="field">新项目口令<input name="project_code" type="password" maxlength="200" autocomplete="new-password" placeholder="留空则保持当前口令"></label><p>口令可自由设置，1–200 个字符，不限字符类型；留空则不修改。更改后所有同行者需要重新输入新口令。当前口令不显示。</p><button class="primary-button">保存项目设置</button></form>
<section class="admin-card"><h2>城市管理</h2><p>同一项目可包含多个城市。含有内容的城市需先整理内容才能删除。</p><form id="city-add" class="inline-form"><label class="field">城市名称<input name="name" maxlength="30" required placeholder="例如：杭州"></label><button class="secondary-button">添加城市</button></form><div id="admin-cities"></div></section>
<section class="admin-card"><h2>用户管理</h2><p>用户无需密码。改名或删除会使该用户的旧会话失效；删除用户保留历史内容和署名。同行者仍可自建 ID。</p><form id="user-add" class="inline-form"><label class="field">用户 ID<input name="user_id" required minlength="2" maxlength="20" placeholder="例如：小明"></label><button class="secondary-button">添加用户</button></form><div id="admin-users"></div></section>
<button id="admin-logout" class="secondary-button">退出管理员</button>
</div></main></body></html>
